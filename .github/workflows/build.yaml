name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup SQLite & sqlite_orm
        shell: bash
        run: |
          mkdir -p src/native/include/sqlite_orm src/native/src
          curl -L -o src/native/include/sqlite_orm/sqlite_orm.h https://raw.githubusercontent.com/fnc12/sqlite_orm/master/include/sqlite_orm/sqlite_orm.h
          curl -L -o sqlite-amalgamation.zip https://www.sqlite.org/2024/sqlite-amalgamation-3450100.zip
          unzip -q sqlite-amalgamation.zip -d sqlite-tmp
          mv sqlite-tmp/*/sqlite3.h src/native/include/
          mv sqlite-tmp/*/sqlite3.c src/native/src/
          rm -rf sqlite-amalgamation.zip sqlite-tmp

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  prepare-release:
    name: Prepare Release
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_flag: --win
          - os: macos-13
            arch: x64
            target_flag: --mac --x64
          - os: macos-latest
            arch: arm64
            target_flag: --mac --arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup SQLite & sqlite_orm
        shell: bash
        run: |
          mkdir -p src/native/include/sqlite_orm src/native/src
          curl -L -o src/native/include/sqlite_orm/sqlite_orm.h https://raw.githubusercontent.com/fnc12/sqlite_orm/master/include/sqlite_orm/sqlite_orm.h
          curl -L -o sqlite-amalgamation.zip https://www.sqlite.org/2024/sqlite-amalgamation-3450100.zip
          unzip -q sqlite-amalgamation.zip -d sqlite-tmp
          mv sqlite-tmp/*/sqlite3.h src/native/include/
          mv sqlite-tmp/*/sqlite3.c src/native/src/
          rm -rf sqlite-amalgamation.zip sqlite-tmp

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Native Addon ${{ matrix.arch }}
        run: npm run build:native -- --arch=${{ matrix.arch }}

      - name: Build Renderer & Main Bundles
        run: npm run build

      - name: Package & Upload Assets
        run: npx electron-builder ${{ matrix.target_flag }} --publish ${{ env.PUBLISH_FLAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FLAG: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

  publish-release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          latest: "true"