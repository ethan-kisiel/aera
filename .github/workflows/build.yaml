name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Pushing a tag like 'v1.0.0' triggers the GitHub Release
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
      name: Run ESLint
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: 'npm'

        - name: Download SQLite and sqlite_orm
          shell: bash
          run: |
            # Create target directories
            mkdir -p src/native/include/sqlite_orm
            mkdir -p src/native/src

            # Download sqlite_orm.h (Latest master)
            curl -L -o src/native/include/sqlite_orm/sqlite_orm.h https://raw.githubusercontent.com/fnc12/sqlite_orm/master/include/sqlite_orm/sqlite_orm.h

            # Download official SQLite amalgamation (Update the year/version URL to match your required SQLite version)
            curl -L -o sqlite-amalgamation.zip https://www.sqlite.org/2024/sqlite-amalgamation-3450100.zip
            unzip -q sqlite-amalgamation.zip -d sqlite-tmp
            
            # Move files to their required directories
            mv sqlite-tmp/*/sqlite3.h src/native/include/
            mv sqlite-tmp/*/sqlite3.c src/native/src/
            
            # Cleanup
            rm -rf sqlite-amalgamation.zip sqlite-tmp

        - name: Install Dependencies
          run: npm ci

        - name: Run Linter
          # Change this to `npx eslint .` if you don't have a "lint" script in your package.json
          run: npm run lint
  # 1. NEW JOB: Create the release first to prevent race conditions
  prepare-release:
    name: Prepare Release
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true # Optional: uncomment if you want to review the release before publishing

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    # 2. REQUIRED: Wait for the release to be created before starting the builds
    needs: prepare-release 
    runs-on: ${{ matrix.os }}
    
    # Required permission for electron-builder to upload to GitHub Releases
    permissions:
      contents: write 

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_flag: --win
          - os: macos-15-intel
            arch: x64
            target_flag: --mac --x64
          - os: macos-latest
            arch: arm64
            target_flag: --mac --arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Download SQLite and sqlite_orm
        shell: bash
        run: |
          # Create target directories
          mkdir -p src/native/include/sqlite_orm
          mkdir -p src/native/src

          # Download sqlite_orm.h (Latest master)
          curl -L -o src/native/include/sqlite_orm/sqlite_orm.h https://raw.githubusercontent.com/fnc12/sqlite_orm/master/include/sqlite_orm/sqlite_orm.h

          # Download official SQLite amalgamation (Update the year/version URL to match your required SQLite version)
          curl -L -o sqlite-amalgamation.zip https://www.sqlite.org/2024/sqlite-amalgamation-3450100.zip
          unzip -q sqlite-amalgamation.zip -d sqlite-tmp
          
          # Move files to their required directories
          mv sqlite-tmp/*/sqlite3.h src/native/include/
          mv sqlite-tmp/*/sqlite3.c src/native/src/
          
          # Cleanup
          rm -rf sqlite-amalgamation.zip sqlite-tmp

      - name: Setup C++ Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        run: npm ci

      - name: Build Native Addon ${{ matrix.arch }}
        run: npm run build:native -- --arch=${{ matrix.arch }}

      - name: Build App Assets
        run: npm run build

      - name: Package & Publish
        run: npx electron-builder ${{ matrix.target_flag }} --publish ${{ env.PUBLISH_FLAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FLAG: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
  # 1. publish release JOB: 
  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false # Optional: uncomment if you want to review the release before publishing
          latest: "true"